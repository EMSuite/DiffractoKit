# DiffractoKit CI: the gate (`swift test -c release`), the consumer check, the README consumer, the example and an iOS
# Simulator build.
#
# The package's floor is macOS 15 / iOS 18 (since 0.2.0) with tools 6.2; the macos-26 image with Xcode 26.6 is pinned below.
# Xcode 26.6's compiler crashed in its SIL ownership verifier on `catch SomeError.someCase { ... }` clauses in the tests
# (run 38747583963, 2026-10-15): the tests therefore bind the error (`catch let caught as SomeError`) and match the case in
# the body. Package.resolved is not tracked, so CI resolves the newest ImagoKit the manifest's range allows, as a consumer does.
#
# THE PINS' PYTHON ORACLES ARE NOT RUN HERE. The tests read committed fixtures (Tests/*/Fixtures/*.json, generated by
# tools/pins/ against pymatgen 2026.9.24, pymatgen-core 2026.10.16, spglib 2.8.0, NumPy 2.5.4, SciPy 1.18.1 and py4DSTEM
# f050d207's table) and compare the kit with them. Regenerating a fixture needs the gitignored References/ (the pinned
# virtual environment and clones) on the maintainer's machine. CI therefore proves "the kit equals the committed pins", not "the pins equal the oracle".
#
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); `swift test -c release` is the gate.
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like the apps: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  changes:
    # A pull request or a merge to main that changes only prose (top-level *.md, docs/, LICENSE, issue templates) takes no macOS runner: `test`
    # is then skipped, which a required check counts as passed (suite#170). Anything else, a Release PR's manifest included, runs.
    name: Build inputs changed
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -vE '^([^/]+\.md|docs/.*|LICENSE|\.github/ISSUE_TEMPLATE/.*)$' changed.txt | grep -q .; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  test:
    # On the pull request, on the push to main after the merge (so main cannot go red unnoticed), on a tag and by hand;
    # skipped when a pull request or a merge changes only prose (`changes`, suite#170).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The org's Mac runners while MACEM_MAC_RUNNER is set (never for a fork PR): either one while MACEM_KIT_RUNNER is set
    # too (EMSuite tools/ci-runner/README.md), else the first; else GitHub's macos-26.
    runs-on: ${{ !github.event.pull_request.head.repo.fork && vars.MACEM_MAC_RUNNER && (vars.MACEM_KIT_RUNNER && fromJSON(vars.MACEM_KIT_RUNNER) || fromJSON(vars.MACEM_MAC_RUNNER)) || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      - name: Gate (swift test, release)
        run: swift test -c release
      - name: Consumer check (a separate package, the public API only)
        run: tools/consumer-check/run.sh
      - name: README consumer (a separate package compiling exactly the README's program, output checked)
        run: tools/readme-consumer/run.sh
      - name: Example executable (the README's first ten minutes)
        run: |
          swift build -c release --product diffracto-example
          "$(swift build -c release --show-bin-path)/diffracto-example"

  post-merge:
    name: iOS build (after merge)
    # Not on pull requests: the free plan's macOS runners are scarce, so the extra builds run on main, tags and by hand.
    if: github.event_name != 'pull_request'
    # GitHub's runner, always: it has the iOS Simulator platform installed, which the Mac runner's user does not
    # (the iOS step failed there). The job runs after the merge and blocks nothing, so the queue does not matter.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build the libraries for iOS (Simulator, not run)
        run: xcodebuild -scheme DiffractoKit-Package -destination 'generic/platform=iOS Simulator' -quiet build

  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .
